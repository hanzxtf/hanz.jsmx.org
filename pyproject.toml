[project]
name = "wagtail-starter-kit"
version = "0.2.2"
description = "A modern, flexible Wagtail starter kit for marketing websites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0",
  "django>=5.2,<5.3",
  "django-environ>=0.12.0",
  "django-storages>=1.14.0",
  "django-turbo-helper>=2.1.4",
  "django-vite>=3.1.0",
  "pillow==11.3.0",
  "uvicorn==0.41.0",
  "uvloop==0.21.0",
  "wagtail>=7.4,<7.5",
  "wagtail-cache>=3.0.0",
  "wagtail-flexible-forms>=2.1.0",
  "wagtail-seo>=3.1.0",
  "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
  "black>=24.4.0",
  "isort>=5.13.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.0",
  "pytest-django>=4.8.0",
  "ruff==0.6.0",
  "watchfiles>=1.1.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
testpaths = ["tests"]
